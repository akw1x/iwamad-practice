<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .profile-card {
      padding: 24px;
      border: 1px solid #f3f4f6;
      margin: 16px auto;
    }

    .liked {
      background-color: #ec4899 !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between text-gray-800 font-sans">

  <header class="p-4 bg-slate-900 border-b text-center text-white">
    <h1 class="text-xl font-bold">User Profile</h1>
  </header>

  <main class="flex justify-center items-center flex-1 p-4">
    <article class="profile-card bg-white rounded-lg max-w-sm w-full text-center shadow-sm">
      <img src="./IMG_3804.JPG" alt="Profile Avatar" class="w-24 h-24 rounded-full border-4  border-indigo-500  mx-auto mb-4 object-cover">
      
      <h2 class="text-2xl font-semibold mb-2">Adel</h2>

      <p class="text-gray-600 mb-4">
        I am a third-year IT Management student passionate about web development and cloud technologies. I enjoy building responsive web applications and learning new frameworks.
      </p>

      <div class="flex justify-center space-x-4 mb-4">
        <a href="mailto:example@gmail.com" class="text-blue-500 hover:underline">Email</a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline">GitHub</a>
      </div>

      <button id="likeBtn" class="bg-indigo-500 hover:bg-purple-700 text-white font-medium px-4 py-2 rounded transition-colors">
        🤍 Like
      </button>
    </article>
  </main>

  <footer class="p-4 bg-slate-900  border-t text-center text-sm text-white">
    <p>&copy; 2026 Adel. All rights reserved.</p>
  </footer>

  <script>
    const likeBtn = document.querySelector('#likeBtn');
    let isLiked = false;

    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;

      if (isLiked) {
        likeBtn.textContent = '❤️ Liked';
        likeBtn.classList.add('liked');
      } else {
        likeBtn.textContent = '🤍 Like';
        likeBtn.classList.remove('liked');
      }
    });
  </script>
</body>
</html>
