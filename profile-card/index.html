<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adel - Profile Card (Week 2)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px; 
    }

    .profile-card {
      border: 1px solid #e5e7eb; 
      padding: 24px; 
      max-width: 420px;
      width: 100%;
      background-color: #ffffff;
    }

    .profile-card.liked {
      border-color: #ec4899;
      background-color: #fdf2f8;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">

  <header class="bg-slate-900 text-white p-4 text-center">
    <h1 class="text-xl font-bold">Adel | KBTU Student</h1>
  </header>

  <main>
    <article id="profileCard" class="profile-card rounded-2xl shadow-lg transition-all duration-300">
      <div class="flex flex-col items-center text-center gap-4">
    
        <img 
          src="./IMG_3804.JPG" 
          alt="Profile photo of Adel"
          class="w-28 h-28 rounded-full border-4 border-indigo-500 object-cover shadow-sm" 
        >

        <div>
          <h2 class="text-2xl font-bold text-gray-900">Adel</h2>
          <p class="text-sm font-medium text-indigo-600">3rd-year IT Management @ KBTU</p>
        </div>

        <p class="text-gray-600 text-sm leading-relaxed">
          I am a student passionate about building and developing modern web applications. Currently mastering web development workflows, frontend frameworks, and cloud technologies.
        </p>

        <div class="flex gap-4 my-1">
          <a href="mailto:a_kikbay@kbtu.kz" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm underline">Email Me</a>
          <a href="https://github.com" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm underline">GitHub Profile</a>
        </div>

        <button 
          id="likeBtn" 
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition duration-200"
        >
          🤍 Like Profile
        </button>

      </div>
    </article>
  </main>

  <footer class="bg-slate-900 text-white text-center p-4 text-xs">
    <p>&copy; 2026 Adel. All rights reserved.</p>
  </footer>

  <script>
    const likeBtn = document.querySelector('#likeBtn');
    const profileCard = document.querySelector('#profileCard');

    likeBtn.addEventListener('click', () => {
      profileCard.classList.toggle('liked');

      if (profileCard.classList.contains('liked')) {
        likeBtn.textContent = '❤️ Liked';
        likeBtn.classList.replace('bg-indigo-600', 'bg-pink-600');
        likeBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-pink-700');
      } else {
        likeBtn.textContent = '🤍 Like Profile';
        likeBtn.classList.replace('bg-pink-600', 'bg-indigo-600');
        likeBtn.classList.replace('hover:bg-pink-700', 'hover:bg-indigo-700');
      }
    });
  </script>
</body>
</html>
